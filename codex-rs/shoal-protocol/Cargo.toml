[package]
name = "codex-shoal-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Keep these explicit: Tidepool consumes this leaf crate through a path nested
# inside its own Cargo workspace, where `workspace = true` would resolve
# against Tidepool rather than Codex.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
